# 푸시하거나 PR을 열 때마다 자동으로 돌리는 검사
#
# 지금까지는 이 세 가지를 사람이 손으로 돌렸다. 잊어버리면 그냥 안 돌아갔고,
# 특히 파생 로직(예매 상태·스탬프·쿠폰 만료)은 "특정 시각에 앱을 켜본 상황"을
# 재현해야 확인되는 것이라 손으로 챙기기 어려웠다.
#
# 세 검사가 서로 잡는 게 다르다:
#   타입 검사  — 없는 속성을 쓰거나 타입이 안 맞는 것
#   린트       — 안 쓰는 import, 훅 의존성 실수 등
#   테스트     — 로직이 실제로 의도대로 계산하는가 (data/__tests__)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 그대로 설치한다(npm install과 달리 버전을 바꾸지 않는다)
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npx expo lint

      # --ci: 스냅샷을 새로 만들지 않고 실패로 처리한다(CI에서 조용히 통과하는 걸 막는다)
      - name: 테스트
        run: npx jest --ci
